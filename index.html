:root{--bg:#f6f3ed;--card:#fffefa;--ink:#3f3932;--muted:#756d64;--line:#e5ded3;--brown:#63513e;--tan:#e9decd;--green:#506750;--red:#a1493d}*{box-sizing:border-box}body{margin:0;font:16px/1.5 Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 17px;border-radius:10px}button:hover{background:var(--tan)}button:focus-visible,a:focus-visible{outline:3px solid #aa8c61;outline-offset:3px}.primary{background:var(--brown);color:white;border-color:var(--brown)}.primary:hover{background:#47392d}.shell{display:grid;grid-template-columns:224px 1fr;min-height:100vh}aside{border-right:1px solid var(--line);padding:36px 22px;display:flex;flex-direction:column;background:#eee8de;position:sticky;top:0;height:100vh}.brand{font:italic 38px Georgia,serif;letter-spacing:-2px}.brand span{font:12px Arial,sans-serif;letter-spacing:2px;display:block;text-transform:uppercase;margin-top:3px}nav{display:grid;gap:8px;margin-top:50px}nav button{text-align:left;border:0;background:none;padding:13px 15px;color:#625a50}nav button.active{background:#fffefa;color:#3f3932;box-shadow:0 2px 10px #4c372a08}nav button span{display:inline-block;width:29px}aside .bottom{margin-top:auto;padding-top:25px;font-size:13px;color:var(--muted)}.avatar{width:35px;height:35px;background:#d8c8b0;display:inline-grid;place-items:center;border-radius:50%;margin-right:8px}main{max-width:1550px;width:100%;padding:35px 42px}.topline{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;letter-spacing:1px;text-transform:uppercase;padding-bottom:22px;border-bottom:1px solid var(--line)}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:30px 0}h1{font:36px Georgia,serif;margin:0 0 7px}h2{font:24px Georgia,serif;margin:0 0 20px}h3{font-size:16px;margin:0 0 8px}p{margin:0;color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:22px}.filters label{font-size:14px;color:var(--muted)}input,select{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fffefa;color:var(--ink);min-width:0}input[type=month]{max-width:185px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:23px}.kpi{min-height:142px}.kpi small{display:block;color:var(--muted);font-size:14px}.kpi strong{display:block;font-size:28px;font-weight:500;margin:14px 0 5px;letter-spacing:-.8px;font-variant-numeric:tabular-nums}.kpi.emphasis{background:var(--brown);color:#fff}.kpi.emphasis small,.kpi.emphasis p{color:#e9dfd2}.kpi p{font-size:12px}.split{display:grid;grid-template-columns:1.5fr 1fr;gap:22px;margin-bottom:22px}.panelhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.panelhead small{color:var(--muted)}.legend{font-size:12px;display:flex;gap:15px;margin-top:15px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--brown)}.dot.light{background:#cebda5}.chart{height:202px;display:flex;align-items:end;gap:16px;padding:20px 4px 0;border-bottom:1px solid var(--line)}.monthbar{flex:1;display:flex;height:100%;align-items:end;justify-content:center;gap:5px;position:relative;padding-bottom:28px}.bar{width:18px;background:var(--brown);border-radius:5px 5px 0 0;min-height:2px}.bar.out{background:#cebda5}.monthbar small{position:absolute;bottom:0;font-size:12px;color:var(--muted)}.source{padding:16px 0;border-bottom:1px solid var(--line)}.source:last-child{border:0}.source .row{display:flex;justify-content:space-between;gap:10px}.source p{font-size:13px;margin-top:6px}.badge{padding:5px 10px;border-radius:20px;background:#ede5d9;font-size:12px;white-space:nowrap}.badge.green{background:#e7eddf;color:#435b38}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:14px}th{font-size:12px;text-transform:uppercase;letter-spacing:.6px;font-weight:500;color:var(--muted);text-align:left;padding:13px 10px;border-bottom:1px solid var(--line)}td{padding:17px 10px;border-bottom:1px solid #eee8df}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}td small{display:block;color:var(--muted);font-size:12px}.empty{text-align:center;padding:34px 20px}.empty h3{font:22px Georgia,serif}.empty p{font-size:14px;max-width:480px;margin:0 auto 18px}.empty button{margin:0 4px}.help{font-size:13px;color:var(--muted);margin:17px 0}.notice{background:#eee6d8;padding:13px 17px;border-radius:10px;margin-bottom:22px;font-size:14px}.negative{color:var(--red)}.textbutton{border:0;background:none;padding:6px;font-size:13px;text-decoration:underline}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.account strong{font-size:22px;display:block;margin-top:10px}dialog{border:1px solid var(--line);border-radius:18px;padding:28px;width:540px;max-width:calc(100% - 24px);max-height:90vh;overflow:auto;background:var(--card);color:var(--ink);box-shadow:0 20px 80px #30271930}dialog::backdrop{background:#322b2459;backdrop-filter:blur(3px)}dialog h2{margin-bottom:5px}dialog form{display:grid;gap:14px;margin-top:23px}label.field{display:grid;gap:6px;font-size:14px}.field input,.field select{width:100%}.dialogactions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.close{float:right;border:0;font-size:24px;padding:0 8px}.error{color:var(--red);font-size:14px}#toast{position:fixed;bottom:22px;right:22px;background:#40362b;color:#fff;padding:13px 20px;border-radius:10px;max-width:90vw;z-index:20;display:none}.settings button{margin:6px 6px 6px 0}details{margin:20px 0}summary{cursor:pointer}details p{margin:10px 0;font-size:14px}.compact{font-size:13px}.mobilebrand{display:none}@media(min-width:1600px){main{padding:40px 60px}}@media(max-width:1150px){.shell{grid-template-columns:185px 1fr}aside{padding:28px 15px}main{padding:25px}.kpis{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}header{align-items:start}h1{font-size:32px}}@media(max-width:700px){.shell{display:block}aside{position:static;height:auto;padding:14px 16px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:27px}.brand span,aside .bottom{display:none}nav{display:flex;overflow:auto;gap:4px;margin-top:13px}nav button{white-space:nowrap;font-size:14px;padding:9px 12px}nav button span{display:none}main{padding:20px 15px}.topline{font-size:11px}header{display:block;margin:22px 0}header .actions{margin-top:20px}h1{font-size:31px}.kpis{gap:10px}.card{padding:17px}.kpi strong{font-size:23px}.kpi small{font-size:13px}.grid2{grid-template-columns:1fr}.panelhead{display:block}.panelhead button{margin-bottom:12px}.chart{gap:8px}.filters{font-size:14px}}
</style></head><body><div class="shell"><aside><div class="brand">pi.<span>Mi espacio financiero</span></div><nav aria-label="Principal" id="nav"></nav><div class="bottom"><span class="avatar">P</span> Mis finanzas<br><br>ARS · Pesos argentinos<br>Guardado en este navegador</div></aside><main><div class="topline"><span>Mi negocio, en orden</span><span id="today"></span></div><header><div><h1 id="title">Tu panorama.</h1><p id="subtitle">Todo lo que entra, sale y queda.</p></div><div class="actions"><button data-action="newExpense">− Agregar gasto</button><button class="primary" data-action="newIncome">+ Registrar cobro</button></div></header><div id="content"></div></main></div><dialog id="modal"><button class="close" aria-label="Cerrar" data-action="close">×</button><h2 id="modalTitle"></h2><p id="modalHint" class="compact"></p><form id="form"></form></dialog><div id="toast" role="status"></div><input hidden type="file" id="importFile" accept="application/json,.json"><script>
'use strict';
const KEY='pi-finanzas-v1', SOURCES=['Programación','Gestoría','Otros'], ACCOUNTS=['Mercado Pago','Cuenta DNI','BBVA débito','Efectivo'], $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const emptyData=()=>({version:1,projects:[],incomes:[],expenses:[],funds:[],transfers:[]});let data=emptyData(),storageError='';try{let raw=localStorage.getItem(KEY);if(raw)data=validateData(JSON.parse(raw));}catch(e){storageError='No se pudo leer el guardado. Restaurá un respaldo antes de registrar datos.'}let view='dashboard',month=localDate().slice(0,7),filter='Todas',query='',editing=null;
function localDate(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`;
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:2}).format(n||0);
const sum=(rows,key='amount')=>Math.round(rows.reduce((a,r)=>a+Number(r[key]||0),0)*100)/100;
const project=id=>data.projects.find(p=>p.id===id);
const source=r=>r.project?project(r.project)?.source:r.source;
const forMonth=r=>r.date?.slice(0,7)===month;
const accepted=r=>filter==='Todas'||source(r)===filter;
const paid=p=>sum(data.incomes.filter(r=>r.project===p.id));
function persist(next){try{localStorage.setItem(KEY,JSON.stringify(next));data=next;return true}catch(e){alert('No se pudo guardar. Descargá un respaldo y revisá el almacenamiento del navegador.');return false}}
function toast(msg){$('#toast').textContent=msg;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3000)}
const navs=[['dashboard','◫','Dashboard'],['projects','▤','Clientes y proyectos'],['incomes','↙','Cobros'],['expenses','↗','Gastos'],['funds','◇','Fondos de trámites'],['accounts','▣','Cuentas'],['settings','⚙','Respaldo y ayuda']];
function render(){ $('#nav').innerHTML=navs.map(([key,icon,label])=>`<button class="${view===key?'active':''}" data-view="${key}"><span>${icon}</span>${label}</button>`).join('');let titles={dashboard:['Tu panorama.','Todo lo que entra, sale y queda.'],projects:['Cada proyecto, claro.','Un cliente puede tener todos los proyectos que necesites.'],incomes:['Tus cobros.','Registrá cada seña, cuota o pago con su fecha real.'],expenses:['Tus gastos, simples.','Cargalos una vez. El resumen se actualiza solo.'],funds:['Dinero para trámites.','Separado de tus honorarios y de tu ganancia.'],accounts:['Tus cuentas.','Traspasar dinero no cambia tu resultado.'],settings:['Todo a salvo.','Respaldos y una guía para empezar.']};$('#title').textContent=titles[view][0];$('#subtitle').textContent=titles[view][1];$('#today').textContent=new Date().toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'});$('#content').innerHTML=(storageError?`<div class="notice">${esc(storageError)}</div>`:'')+({dashboard:dashboard,projects:projectsView,incomes:()=>recordsView('incomes'),expenses:()=>recordsView('expenses'),funds:fundsView,accounts:accountsView,settings:settingsView}[view])(); }
function filters(includeSource=true){return `<div class="filters"><label for="month">Mes</label><input id="month" type="month" value="${month}" aria-label="Mes del resumen">${includeSource?`<select id="filter" aria-label="Actividad">${['Todas',...SOURCES].map(s=>`<option ${s===filter?'selected':''}>${s}</option>`).join('')}</select>`:''}<span class="compact">Importes en ARS</span></div>`}
function kpi(label,n,note,emphasis=false){return `<div class="card kpi ${emphasis?'emphasis':''}"><small>${label}</small><strong class="${n<0&&!emphasis?'negative':''}">${money(n)}</strong><p>${note}</p></div>`}
function dashboard(){let inc=data.incomes.filter(forMonth).filter(accepted),exp=data.expenses.filter(forMonth).filter(accepted),businessExp=exp.filter(r=>r.source!=='Personal'),personal=filter==='Todas'?sum(exp.filter(r=>r.source==='Personal')):0,pending=sum(data.projects.filter(p=>filter==='Todas'||p.source===filter).map(p=>({amount:Math.max(0,p.total-paid(p))}))),net=sum(inc)-sum(businessExp);return `${filters()}<div class="kpis">${kpi('Cobrado este mes',sum(inc),'Pagos efectivamente recibidos')}${kpi('Gastos del negocio',sum(businessExp),'Pagados durante el mes')}${kpi('Neto del negocio',net,'Cobros menos gastos del negocio',true)}${kpi('Pendiente de cobro',pending,'Todos los proyectos · sin filtro de mes')}</div><div class="split"><section class="card"><div class="panelhead"><h2>Cómo viene el año</h2><small>Últimos 6 meses · ${filter==='Todas'?'todas las actividades':esc(filter)}</small></div>${chart()}<div class="legend"><span><i class="dot"></i>Cobros</span><span><i class="dot light"></i>Gastos del negocio</span></div></section><section class="card"><h2>Resultado por actividad</h2>${SOURCES.filter(s=>filter==='Todas'||s===filter).map(s=>{let i=sum(inc.filter(r=>source(r)===s)),e=sum(businessExp.filter(r=>r.source===s));return `<div class="source"><div class="row"><span>${s}</span><strong class="${i-e<0?'negative':''}">${money(i-e)}</strong></div><p>Cobros ${money(i)} &nbsp; / &nbsp; Gastos ${money(e)}</p></div>`}).join('')}</section></div><div class="notice">${filter==='Todas'?`Gastos personales: <b>${money(personal)}</b> · Disponible del mes después de gastos personales: <b>${money(net-personal)}</b>.`:'El neto corresponde a la actividad seleccionada.'} El neto se calcula por cobros y pagos; no incluye pendientes ni fondos de terceros.</div><section class="card"><div class="panelhead"><h2>Proyectos por cobrar</h2><button class="textbutton" data-view="projects">Ver todos los proyectos</button></div>${projectTable(data.projects.filter(p=>(filter==='Todas'||p.source===filter)&&paid(p)<p.total).slice(0,6))}</section>`}
function chart(){let [y,m]=month.split('-').map(Number),rows=[];for(let j=5;j>=0;j--){let d=new Date(y,m-1-j,1),key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;rows.push({label:d.toLocaleDateString('es-AR',{month:'short'}),i:sum(data.incomes.filter(r=>r.date.startsWith(key)&&accepted(r))),e:sum(data.expenses.filter(r=>r.date.startsWith(key)&&r.source!=='Personal'&&accepted(r)))})}let max=Math.max(...rows.flatMap(r=>[r.i,r.e]),1);return `<div class="chart" role="img" aria-label="Cobros y gastos de los últimos seis meses"><span class="sr-only" hidden>${rows.map(r=>`${r.label}: cobros ${money(r.i)}, gastos ${money(r.e)}`).join('; ')}</span>${rows.map(r=>`<div class="monthbar" title="${r.label}: cobros ${money(r.i)} / gastos ${money(r.e)}"><div class="bar" style="height:${r.i/max*150}px"></div><div class="bar out" style="height:${r.e/max*150}px"></div><small>${r.label}</small></div>`).join('')}</div>`}
function projectTable(rows){if(!rows.length)return `<div class="empty"><h3>Un poco de orden empieza acá.</h3><p>Agregá tu primer proyecto, su valor acordado y después sus pagos. Los saldos se calculan solos.</p><button data-action="newProject" class="primary">+ Agregar proyecto</button></div>`;return `<div class="tablewrap"><table><thead><tr><th>Cliente / proyecto</th><th>Actividad</th><th class="num">Valor total</th><th class="num">Cobrado</th><th class="num">Resta</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${rows.map(p=>{let n=paid(p);return `<tr><td><b>${esc(p.client)}</b><small>${esc(p.name)}</small></td><td>${esc(p.source)}</td><td class="num">${money(p.total)}</td><td class="num">${money(n)}</td><td class="num">${money(Math.max(0,p.total-n))}${n>p.total?`<small>A favor del cliente: ${money(n-p.total)}</small>`:''}</td><td><span class="badge ${n>=p.total?'green':''}">${n>=p.total?'Cobrado':esc(p.status)}</span></td><td><button class="textbutton" data-action="pay" data-id="${p.id}">Cobrar</button><button class="textbutton" data-action="editProject" data-id="${p.id}">Editar</button><button class="textbutton" data-action="deleteProject" data-id="${p.id}">Eliminar</button></td></tr>`}).join('')}</tbody></table></div>`}
function projectsView(){let rows=data.projects.filter(p=>`${p.client} ${p.name}`.toLowerCase().includes(query.toLowerCase()));return `<div class="actions" style="margin-bottom:22px"><input id="search" placeholder="Buscar cliente o proyecto" aria-label="Buscar cliente o proyecto" value="${esc(query)}"><button class="primary" data-action="newProject">+ Agregar proyecto</button></div><section class="card">${projectTable(rows)}</section><p class="help">Los cobros corresponden al historial completo de cada proyecto. Si cambiás el nombre del cliente o proyecto, sus pagos siguen vinculados.</p>`}
function recordsView(kind){let isInc=kind==='incomes',rows=data[kind].filter(forMonth).filter(r=>isInc?accepted(r):filter==='Todas'||r.source===filter).sort((a,b)=>b.date.localeCompare(a.date));return `${filters()}<section class="card"><div class="panelhead"><h2>${isInc?'Cobros registrados':'Gastos registrados'}</h2><b>${money(sum(rows))}</b></div>${recordTable(rows,kind)}</section><p class="help">${isInc?'Cada pago se registra una sola vez. Para pagos combinados, cargá una fila por cuenta.':'Incluí los gastos personales con actividad Personal. Los pagos para trámites se cargan en Fondos de trámites.'}</p>`}
function recordTable(rows,kind){if(!rows.length)return `<div class="empty"><h3>Todavía no hay registros.</h3><p>Elegí otro mes o registrá ${kind==='incomes'?'un cobro':'un gasto'} para comenzar.</p><button class="primary" data-action="${kind==='incomes'?'newIncome':'newExpense'}">+ ${kind==='incomes'?'Registrar cobro':'Agregar gasto'}</button></div>`;return `<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>Actividad</th><th>Cuenta</th><th class="num">Importe</th><th>Acciones</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.date.split('-').reverse().join('/'))}</td><td>${esc(r.concept)}${r.project?`<small>${esc(project(r.project)?.client)} · ${esc(project(r.project)?.name)}</small>`:''}</td><td>${esc(source(r))}</td><td>${esc(r.account)}</td><td class="num">${money(r.amount)}</td><td><button class="textbutton" data-action="editRecord" data-kind="${kind}" data-id="${r.id}">Editar</button><button class="textbutton" data-action="deleteRecord" data-kind="${kind}" data-id="${r.id}">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`}
function fundsView(){let groups=[...new Set(data.funds.map(r=>r.client))];return `<div class="notice">Registrá acá el dinero recibido para aranceles y los pagos hechos por cuenta del cliente. Tus honorarios van en Cobros. Si recibís ambos juntos, separalos en dos registros.</div><button class="primary" data-action="newFund">+ Registrar fondos</button><div class="grid2" style="margin-top:22px">${groups.map(c=>{let r=data.funds.filter(r=>r.client===c),n=sum(r.filter(r=>r.type==='Recibido'))-sum(r.filter(r=>r.type==='Pagado'));return `<div class="card"><h3>${esc(c)}</h3><strong class="${n<0?'negative':''}">${money(n)}</strong><p class="compact">${n<0?'Adelantaste este dinero':n>0?'Fondos del cliente por rendir':'Fondos rendidos'}</p></div>`}).join('')}</div><section class="card" style="margin-top:22px"><h2>Historial de fondos</h2><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Cliente / trámite</th><th>Tipo</th><th>Concepto</th><th>Cuenta</th><th class="num">Importe</th><th></th></tr></thead><tbody>${data.funds.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.client)}</td><td>${r.type}</td><td>${esc(r.concept)}</td><td>${esc(r.account)}</td><td class="num">${money(r.amount)}</td><td><button class="textbutton" data-action="editRecord" data-kind="funds" data-id="${r.id}">Editar</button><button class="textbutton" data-action="deleteRecord" data-kind="funds" data-id="${r.id}">Eliminar</button></td></tr>`).join('')}</tbody></table></div>${!data.funds.length?'<p class="empty">Todavía no registraste fondos de clientes.</p>':''}</section>`}
function accountsView(){return `${filters(false)}<div class="grid2">${ACCOUNTS.map(a=>{let n=sum(data.incomes.filter(r=>forMonth(r)&&r.account===a))-sum(data.expenses.filter(r=>forMonth(r)&&r.account===a))+sum(data.funds.filter(r=>forMonth(r)&&r.account===a&&r.type==='Recibido'))-sum(data.funds.filter(r=>forMonth(r)&&r.account===a&&r.type==='Pagado'))+sum(data.transfers.filter(r=>forMonth(r)&&r.to===a))-sum(data.transfers.filter(r=>forMonth(r)&&r.from===a));return `<section class="card account"><h3>${a}</h3><strong class="${n<0?'negative':''}">${money(n)}</strong><p class="compact">Variación registrada del mes</p></section>`}).join('')}</div><p class="help">No es el saldo bancario: muestra entradas menos salidas registradas. Incluye fondos de clientes. No se cargaron saldos iniciales.</p><button class="primary" data-action="newTransfer">+ Traspaso entre cuentas</button><section class="card" style="margin-top:22px"><h2>Traspasos del mes</h2><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Desde</th><th>Hacia</th><th class="num">Importe</th><th></th></tr></thead><tbody>${data.transfers.filter(forMonth).map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.from)}</td><td>${esc(r.to)}</td><td class="num">${money(r.amount)}</td><td><button class="textbutton" data-action="deleteRecord" data-kind="transfers" data-id="${r.id}">Eliminar</button></td></tr>`).join('')}</tbody></table></div></section>`}
function settingsView(){return `<section class="card settings"><h2>Tu respaldo</h2><p>Los datos se guardan en este navegador y dispositivo. Descargá una copia con frecuencia y antes de cambiar de equipo o borrar datos del navegador.</p><div style="margin-top:17px"><button class="primary" data-action="backup">Descargar respaldo</button><button data-action="restore">Restaurar respaldo</button><button data-action="csv">Exportar registros CSV</button></div><p class="help">El respaldo JSON permite recuperar todo. El CSV sirve para consultar los registros en Excel; no reemplaza el respaldo.</p></section><section class="card" style="margin-top:22px"><h2>Cómo usar tu espacio</h2><details open><summary>1. Clientes y proyectos</summary><p>Creá un proyecto por cada trabajo, con el nombre del cliente y el total acordado. Podés tener varios proyectos de la misma persona. En gestoría, el total del proyecto debe ser sólo tus honorarios.</p></details><details><summary>2. Cobros y gastos</summary><p>Registrá cada pago en su fecha real. Un anticipo reduce el pendiente del proyecto y cuenta como cobro del mes en que lo recibiste. Cargá los gastos con su actividad. Elegí Personal para que se resten después del neto del negocio. Un gasto compartido entre actividades se divide en dos filas.</p></details><details><summary>3. Trámites y cuentas</summary><p>El dinero para tasas y aranceles va en Fondos de trámites. Tus honorarios van en Cobros. Los traspasos entre tus cuentas no son ingresos ni gastos. Si un pago se hace mitad por una cuenta y mitad por otra, registrá dos filas. Registrá gastos al pagarlos; no cargues también la misma compra con tarjeta y el pago del resumen.</p></details><details><summary>4. Excel y publicación</summary><p>La app y la planilla son herramientas independientes con los mismos criterios; no se sincronizan automáticamente. Esta versión funciona localmente, sin cuenta ni sincronización entre dispositivos. Puede publicarse como sitio estático en Vercel. Para acceder a tus datos desde varios dispositivos hará falta conectar una base de datos y un inicio de sesión.</p></details><p class="help">Todos los importes son ARS. No mezcles importes en dólares sin convertirlos antes. Neto del negocio = cobros − gastos del negocio. Disponible = neto − gastos personales.</p></section>`}
function input(label,name,type='text',value='',required=true){return `<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'min="0.01" max="999999999999" step="0.01"':''} ${type==='text'?'maxlength="150"':''}></label>`}
function select(label,name,opts,value){return `<label class="field">${label}<select name="${name}">${opts.map(o=>{let v=Array.isArray(o)?o[0]:o,t=Array.isArray(o)?o[1]:o;return `<option value="${esc(v)}" ${v===value?'selected':''}>${esc(t)}</option>`}).join('')}</select></label>`}
function openForm(kind,id='',projectId=''){let record=id?data[kind].find(r=>r.id===id):{},r=record||{};editing={kind,id};let fields='',hint='';if(kind==='projects'){fields=input('Cliente','client','text',r.client)+input('Nombre del proyecto / trámite','name','text',r.name)+select('Actividad','source',SOURCES,r.source)+input('Valor total acordado (ARS)','total','number',r.total)+select('Estado del trabajo','status',['En curso','Por comenzar','Entregado','Pausado'],r.status);hint='Para gestoría, ingresá sólo el valor de tus honorarios.'}else if(kind==='transfers'){fields=input('Fecha','date','date',r.date||localDate())+select('Desde','from',ACCOUNTS,r.from)+select('Hacia','to',ACCOUNTS,r.to||ACCOUNTS[1])+input('Importe (ARS)','amount','number',r.amount);hint='No se suma a ingresos ni gastos.'}else{fields=input('Fecha','date','date',r.date||localDate());if(kind==='incomes'){fields+=select('Proyecto','project',[['','Sin proyecto (ingreso independiente)'],...data.projects.map(p=>[p.id,`${p.client} · ${p.name}`])],r.project||projectId)+select('Actividad (sólo si no hay proyecto)','source',SOURCES,r.source);hint='Si elegís proyecto, se usa su actividad automáticamente.'}if(kind==='expenses')fields+=select('Actividad','source',[...SOURCES,'Personal'],r.source)+select('Categoría','category',['General','Herramientas y software','Hosting y dominios','Movilidad','Servicios','Comisiones','Impuestos','Comida','Compras'],r.category);if(kind==='funds'){fields+=input('Cliente / trámite (mismo nombre para cada operación)','client','text',r.client)+select('Tipo','type',['Recibido','Pagado'],r.type);hint='Fondos de terceros: no afectan tu ganancia.'}fields+=input('Concepto','concept','text',r.concept)+input('Importe (ARS)','amount','number',r.amount)+select('Cuenta','account',ACCOUNTS,r.account)}$('#modalTitle').textContent=(id?'Editar ': 'Agregar ')+({projects:'proyecto',incomes:'cobro',expenses:'gasto',funds:'fondos',transfers:'traspaso'}[kind]);$('#modalHint').textContent=hint;$('#form').innerHTML=fields+'<p class="error" id="formError" role="alert"></p><div class="dialogactions"><button type="button" data-action="close">Cancelar</button><button type="submit" class="primary">Guardar</button></div>';$('#modal').showModal()}
$('#form').addEventListener('submit',e=>{e.preventDefault();let {kind,id}=editing,r=Object.fromEntries(new FormData(e.target));for(let k of Object.keys(r))r[k]=r[k].trim();if(Object.entries(r).some(([k,v])=>!v&&k!=='project')){$('#formError').textContent='Completá todos los campos.';return}if(kind==='projects'){r.total=Number(r.total);if(data.projects.some(p=>p.id!==id&&p.client.toLowerCase()===r.client.toLowerCase()&&p.name.toLowerCase()===r.name.toLowerCase())){$('#formError').textContent='Ya existe ese proyecto para este cliente.';return}}else r.amount=Number(r.amount);if(kind==='transfers'&&r.from===r.to){$('#formError').textContent='Elegí dos cuentas diferentes.';return}r.id=id||uid();let next=structuredClone(data);if(id)next[kind]=next[kind].map(o=>o.id===id?r:o);else next[kind].push(r);try{validateData(next)}catch(err){$('#formError').textContent=err.message;return}if(persist(next)){$('#modal').close();render();toast('Guardado. Tu resumen ya está actualizado.')}});
function validateData(d){if(d.version!==1)throw Error('Versión de respaldo no compatible.');let ids=new Set();for(let kind of ['projects','incomes','expenses','funds','transfers']){if(!Array.isArray(d[kind])||d[kind].length>100000)throw Error('Respaldo inválido.');for(let r of d[kind]){if(!r||typeof r.id!=='string'||!/^[a-zA-Z0-9.-]+$/.test(r.id)||ids.has(r.id))throw Error('Identificador inválido o repetido.');ids.add(r.id);let n=kind==='projects'?r.total:r.amount;if(typeof n!=='number'||!Number.isFinite(n)||n<=0||n>999999999999)throw Error('El importe debe ser mayor que cero.');let keys=kind==='projects'?['client','name','status']:kind==='transfers'?[]:kind==='funds'?['client','concept']:['concept'];for(let key of keys)if(typeof r[key]!=='string'||!r[key].trim()||r[key].length>150)throw Error('Falta un dato obligatorio.');if(kind!=='projects'&&(!/^\d{4}-\d{2}-\d{2}$/.test(r.date)||Number.isNaN(Date.parse(r.date))||new Date(r.date).toISOString().slice(0,10)!==r.date))throw Error('Fecha inválida.');if(['projects','expenses'].includes(kind)&&![...SOURCES,...(kind==='expenses'?['Personal']:[])].includes(r.source))throw Error('Actividad inválida.');if(kind==='projects'&&!['En curso','Por comenzar','Entregado','Pausado'].includes(r.status))throw Error('Estado inválido.');if(['incomes','expenses','funds'].includes(kind)&&!ACCOUNTS.includes(r.account))throw Error('Cuenta inválida.');if(kind==='funds'&&!['Recibido','Pagado'].includes(r.type))throw Error('Tipo de fondo inválido.');if(kind==='transfers'&&(!ACCOUNTS.includes(r.from)||!ACCOUNTS.includes(r.to)||r.from===r.to))throw Error('Traspaso inválido.')}}for(let r of d.incomes){if(r.project&&!d.projects.some(p=>p.id===r.project))throw Error('Hay un cobro con proyecto inexistente.');if(!r.project&&!SOURCES.includes(r.source))throw Error('Actividad inválida.')}return d}
function download(name,content,mime){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type:mime}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportCsv(){let rows=[['Tipo','Fecha','Cliente','Proyecto','Actividad','Concepto','Cuenta / origen','Destino','Importe ARS','Estado / categoría']];data.projects.forEach(p=>rows.push(['Proyecto','',p.client,p.name,p.source,'Valor acordado','','',p.total,p.status]));data.incomes.forEach(r=>rows.push(['Cobro',r.date,project(r.project)?.client||'',project(r.project)?.name||'',source(r),r.concept,r.account,'',r.amount,'']));data.expenses.forEach(r=>rows.push(['Gasto',r.date,'','',r.source,r.concept,r.account,'',r.amount,r.category]));data.funds.forEach(r=>rows.push(['Fondos '+r.type,r.date,r.client,'','Gestoría',r.concept,r.account,'',r.amount,'']));data.transfers.forEach(r=>rows.push(['Traspaso',r.date,'','','','',r.from,r.to,r.amount,'']));download(`Pi_registros_${localDate()}.csv`,'\uFEFF'+rows.map(row=>row.map(v=>{let s=typeof v==='number'?v.toFixed(2).replace('.',','):String(v??'');if(/^[=+@-]/.test(s)&&typeof v!=='number')s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;render();return}let a=b.dataset.action,id=b.dataset.id,kind=b.dataset.kind;if(a==='close')$('#modal').close();if(a==='newProject')openForm('projects');if(a==='newIncome')openForm('incomes');if(a==='newExpense')openForm('expenses');if(a==='newFund')openForm('funds');if(a==='newTransfer')openForm('transfers');if(a==='pay')openForm('incomes','',id);if(a==='editProject')openForm('projects',id);if(a==='editRecord')openForm(kind,id);if(a==='deleteProject'){if(data.incomes.some(r=>r.project===id)){alert('Este proyecto tiene cobros. Eliminá o reasigná esos cobros antes de borrarlo.');return}kind='projects';a='deleteRecord'}if(a==='deleteRecord'&&confirm('¿Eliminar este registro? Se actualizarán los totales.')){let n=structuredClone(data);n[kind]=n[kind].filter(r=>r.id!==id);if(persist(n)){render();toast('Registro eliminado.')}}if(a==='backup')download(`Pi_respaldo_${localDate()}.json`,JSON.stringify(data,null,2),'application/json');if(a==='restore')$('#importFile').click();if(a==='csv')exportCsv()});
document.addEventListener('change',e=>{if(e.target.id==='month'&&e.target.value){month=e.target.value;render()}if(e.target.id==='filter'){filter=e.target.value;render()}});document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}});
$('#importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>20000000)throw Error('Archivo demasiado grande.');let d=validateData(JSON.parse(await f.text()));if(confirm('Restaurar reemplazará todos los registros actuales. ¿Ya guardaste un respaldo?')){if(persist(d)){storageError='';render();toast('Respaldo restaurado.')}}}catch(err){alert('No se restauró el archivo: '+err.message)}e.target.value=''});render();
</script></body></html>
